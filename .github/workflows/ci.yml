name: CI

on:
  push:
    branches: [main]
  pull_request:

# Push mới lên cùng nhánh/PR -> huỷ lần chạy cũ
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: social
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Toàn bộ test: 72 unit test + SocialApplicationTests (dùng Testcontainers MySQL,
      # runner ubuntu-latest có sẵn Docker).
      - name: Tests
        run: sh ./mvnw -B -ntp test
      # Build jar đúng như Dockerfile chạy
      - name: Package
        run: sh ./mvnw -B -ntp -DskipTests package

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forum_fe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: forum_fe/package-lock.json
      - run: npm ci
      - run: npm run build

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Push mới lên cùng nhánh/PR -> huỷ lần chạy cũ
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: social
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Toàn bộ test: 84 unit test + SocialApplicationTests (dùng Testcontainers MySQL,
      # runner ubuntu-latest có sẵn Docker).
      # Kéo sẵn image để thời gian tải không tính vào ngưỡng chờ khởi động
      # container của Testcontainers, và rút ngắn bước test.
      - name: Kéo sẵn image MySQL cho Testcontainers
        run: docker pull mysql:8.0
      - name: Tests
        run: sh ./mvnw -B -ntp test
      # Log của Actions chỉ tải được nếu có quyền admin repo, còn artifact thì đọc
      # công khai — nên khi test hỏng, đẩy báo cáo surefire ra artifact để xem được
      # nguyên nhân mà không cần vào giao diện web.
      - name: Báo cáo test (khi hỏng)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-reports
          path: social/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7
      # Build jar đúng như Dockerfile chạy
      - name: Package
        run: sh ./mvnw -B -ntp -DskipTests package

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forum_fe
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: forum_fe/package-lock.json
      - run: npm ci
      - run: npm run build

  # Dockerfile chỉ được kiểm chứng khi thật sự build image — máy dev (Windows) thường
  # không có Docker, nên để CI làm. Chỉ build, không push.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image backend
        run: docker build -t forum-backend:ci social
      - name: Build image frontend
        run: docker build -t forum-frontend:ci forum_fe

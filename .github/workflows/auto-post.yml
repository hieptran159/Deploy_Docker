name: auto-post

# ⚠️ TẮT tự động: Cloudflare "Bot fight mode" (gói free) chặn IP của GitHub runner
# bằng managed challenge (403), rule WAF "Skip" không bỏ qua được. Đường chính là
# cron trên máy Ubuntu (tools/auto-poster/README.md mục B).
# Chỉ giữ workflow này để chạy TAY, và chỉ dùng được nếu bạn TẮT Bot fight mode
# (Cloudflare → Security → Settings) rồi thêm 2 secret FORUM_BOT_EMAIL / FORUM_BOT_PASSWORD.

on:
  workflow_dispatch: {}       # chỉ chạy tay từ tab Actions

concurrency:
  group: auto-post
  cancel-in-progress: false

permissions:
  contents: write            # để commit .state.json trở lại repo

env:
  API_URL: https://api.hipe.id.vn

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Kiểm tra secret
        env:
          BOT_EMAIL: ${{ secrets.FORUM_BOT_EMAIL }}
          BOT_PASSWORD: ${{ secrets.FORUM_BOT_PASSWORD }}
        run: |
          miss=
          [ -n "$BOT_EMAIL" ]    || miss="$miss FORUM_BOT_EMAIL"
          [ -n "$BOT_PASSWORD" ] || miss="$miss FORUM_BOT_PASSWORD"
          if [ -n "$miss" ]; then
            echo "::error::Thiếu secret:$miss  (thêm ở tab 'Secrets', KHÔNG phải 'Variables')"
            exit 1
          fi
          echo "API_URL   = $API_URL"
          echo "BOT_EMAIL length   = ${#BOT_EMAIL}"
          echo "BOT_PASSWORD length = ${#BOT_PASSWORD}"

      - name: Lấy RSS -> content/*.md (nếu có feeds.txt)
        working-directory: tools/auto-poster
        env:
          RSS_TAG: ${{ vars.RSS_TAG }}
          RSS_MAX_PER_RUN: ${{ vars.RSS_MAX_PER_RUN }}
        run: '[ -f feeds.txt ] && node fetch-rss.mjs || echo "bỏ qua RSS (không có feeds.txt)"'

      - name: Đăng bài
        working-directory: tools/auto-poster
        env:
          BOT_EMAIL: ${{ secrets.FORUM_BOT_EMAIL }}
          BOT_PASSWORD: ${{ secrets.FORUM_BOT_PASSWORD }}
          # Cloudflare chặn IP của GitHub runner -> gửi header bí mật để WAF bỏ challenge.
          # Bỏ trống thì bỏ qua (dùng khi chạy trên máy không bị Cloudflare chặn).
          BYPASS_TOKEN: ${{ secrets.FORUM_BYPASS_TOKEN }}
        run: node post.mjs

      - name: Lưu .state.json (chống đăng trùng lần sau)
        if: always()
        run: |
          cd tools/auto-poster
          git add -f .state.json .rss-seen.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Không có bài mới."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "auto-post: cập nhật .state.json [skip ci]"
            git push
          fi

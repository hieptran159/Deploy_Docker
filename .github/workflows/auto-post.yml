name: auto-post

# Đăng các file tools/auto-poster/content/*.md lên forum.
# Cần 2 secret (Settings → Secrets and variables → Actions → tab "Secrets",
# KHÔNG phải "Variables"):
#   FORUM_BOT_EMAIL     email tài khoản bot
#   FORUM_BOT_PASSWORD  mật khẩu tài khoản bot
# API_URL để thẳng bên dưới (không nhạy cảm).

on:
  push:
    branches: [main]
    paths:
      - 'tools/auto-poster/content/**'   # commit file .md mới -> đăng ngay
  schedule:
    - cron: '17 * * * *'      # mỗi giờ, phút thứ 17 (giờ UTC) — mạng an toàn
  workflow_dispatch: {}       # cho phép bấm chạy tay

concurrency:
  group: auto-post
  cancel-in-progress: false

permissions:
  contents: write            # để commit .state.json trở lại repo

env:
  API_URL: https://api.hipe.id.vn

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Kiểm tra secret
        env:
          BOT_EMAIL: ${{ secrets.FORUM_BOT_EMAIL }}
          BOT_PASSWORD: ${{ secrets.FORUM_BOT_PASSWORD }}
        run: |
          miss=
          [ -n "$BOT_EMAIL" ]    || miss="$miss FORUM_BOT_EMAIL"
          [ -n "$BOT_PASSWORD" ] || miss="$miss FORUM_BOT_PASSWORD"
          if [ -n "$miss" ]; then
            echo "::error::Thiếu secret:$miss  (thêm ở tab 'Secrets', KHÔNG phải 'Variables')"
            exit 1
          fi
          echo "API_URL   = $API_URL"
          echo "BOT_EMAIL length   = ${#BOT_EMAIL}"
          echo "BOT_PASSWORD length = ${#BOT_PASSWORD}"

      - name: Đăng bài
        working-directory: tools/auto-poster
        env:
          BOT_EMAIL: ${{ secrets.FORUM_BOT_EMAIL }}
          BOT_PASSWORD: ${{ secrets.FORUM_BOT_PASSWORD }}
        run: node post.mjs

      - name: Lưu .state.json (chống đăng trùng lần sau)
        if: always()
        run: |
          cd tools/auto-poster
          [ -f .state.json ] || exit 0
          git add -f .state.json
          if git diff --cached --quiet; then
            echo "Không có bài mới."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "auto-post: cập nhật .state.json [skip ci]"
            git push
          fi

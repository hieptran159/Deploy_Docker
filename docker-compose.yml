# Đóng gói toàn bộ diễn đàn: 1 lệnh là chạy được ở bất kỳ máy nào có Docker
#   docker compose up -d --build
#
# Cổng mặc định (đổi trong file .env nếu cần):
#   Frontend  -> http://localhost         (FRONTEND_PORT=80)
#   Backend   -> http://localhost:8081    (BACKEND_PORT=8081)
#   Socket.IO -> http://localhost:8082    (SOCKET_PORT=8082)
#   MySQL     -> localhost:3307           (DB_PORT=3307, trong container là 3306)
#
# Khi deploy lên máy khác có tên miền/công IP riêng, đặt trong .env:
#   PUBLIC_API_URL=http://<host>:8081
#   PUBLIC_SOCKET_URL=http://<host>:8082
# rồi build lại frontend:  docker compose up -d --build frontend

# Giới hạn dung lượng log container (json-file mặc định KHÔNG xoay vòng -> phình vô hạn).
# 10MB x 3 file = tối đa ~30MB/container.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: mysql:8.0
    container_name: forum-db
    restart: unless-stopped
    logging: *default-logging
    # Giữ binary log 7 ngày thay vì mặc định 30 ngày (đủ cho khôi phục sự cố, đỡ phình đĩa).
    command:
      - --binlog-expire-logs-seconds=604800
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-tranhiep12345}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-socialapp}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Schema do Flyway tạo khi backend khởi động (social/src/main/resources/db/migration/).
      # Volume rỗng -> DB rỗng -> Flyway chạy V1__baseline.sql. Muốn nạp sẵn 1 bản dump
      # (chuyển hạ tầng) thì dùng scripts/db-import.sh sau khi container db chạy.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - app-network

  backend:
    build:
      context: ./social
    container_name: forum-backend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-socialapp}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-tranhiep12345}
      SERVER_PORT: 8081
      SOCKET_SERVER_PORT: 8082
      SOCKET_SERVER_HOST: 0.0.0.0
      # Bắt buộc có trong .env. Tạo khoá mới bằng `openssl rand -base64 32`.
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET chua duoc dat trong .env}"
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-no-reply@hipe.id.vn}
      SENDGRID_FROM_NAME: ${SENDGRID_FROM_NAME:-HIPDN-EA Forum}
      # CORS: danh sách origin FE được phép (cách nhau dấu phẩy). "*" = mọi nơi (mặc định).
      # Deploy thật nên đặt cụ thể, vd: https://app.example.com
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-*}
      # Mã hoá nội dung tin nhắn khi lưu DB. Base64 của 32 byte (openssl rand -base64 32). Trống = không mã hoá.
      MESSAGE_CRYPTO_KEY: ${MESSAGE_CRYPTO_KEY:-}
      # Giới hạn tần suất /auth/** (có mặc định hợp lý; chỉ set khi cần đổi)
      RATELIMIT_ENABLED: ${RATELIMIT_ENABLED:-true}
      RATELIMIT_SIGNIN: ${RATELIMIT_SIGNIN:-20}
      RATELIMIT_SIGNUP: ${RATELIMIT_SIGNUP:-6}
      RATELIMIT_OTP_SEND: ${RATELIMIT_OTP_SEND:-5}
      RATELIMIT_OTP_CHECK: ${RATELIMIT_OTP_CHECK:-20}
      # Chỉ true khi có nginx/Cloudflare tin cậy đặt X-Forwarded-For. Backend lộ trực tiếp -> để false.
      RATELIMIT_TRUST_FORWARDED: ${RATELIMIT_TRUST_FORWARDED:-false}
      # Ảnh upload: chặn kích thước + tự thu nhỏ/nén (có mặc định)
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-10485760}
      UPLOAD_MULTIPART_MAX: ${UPLOAD_MULTIPART_MAX:-12MB}
      UPLOAD_MAX_DIMENSION: ${UPLOAD_MAX_DIMENSION:-1600}
      UPLOAD_JPEG_QUALITY: ${UPLOAD_JPEG_QUALITY:-0.82}
      # Tự ẩn bài khi đạt số báo cáo OPEN này (0 = tắt)
      MOD_POST_AUTOHIDE: ${MOD_POST_AUTOHIDE:-3}
      # Kích thước connection pool (mặc định hợp lý; chỉ set khi cần)
      DB_POOL_MAX: ${DB_POOL_MAX:-15}
      DB_POOL_MIN: ${DB_POOL_MIN:-5}
      # Ghi log "Session Metrics" mỗi request để soi số truy vấn / thời gian. Chỉ bật khi chẩn đoán.
      JPA_STATS: ${JPA_STATS:-false}
      # Ghi đè tham số JDBC nếu cần (mặc định đã tắt TLS nội bộ + bật cache prepared-statement)
      MYSQL_PARAMS: ${MYSQL_PARAMS:-useSSL=false&allowPublicKeyRetrieval=true&cachePrepStmts=true&useServerPrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useLocalSessionState=true&useLocalTransactionState=true&rewriteBatchedStatements=true&cacheServerConfiguration=true&serverTimezone=Asia/Ho_Chi_Minh}
    ports:
      - "${BACKEND_PORT:-8081}:8081"
      - "${SOCKET_PORT:-8082}:8082"
    volumes:
      # Ảnh người dùng upload -> giữ lại qua các lần build/redeploy
      - uploads:/app/uploads
    networks:
      - app-network

  frontend:
    build:
      context: ./forum_fe
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:8081}
        VITE_SOCKET_URL: ${PUBLIC_SOCKET_URL:-http://localhost:8082}
    container_name: forum-frontend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql-data:
  uploads:

# Tham số JDBC: tắt TLS trên link nội bộ Docker (bỏ handshake mỗi kết nối), bật cache
# prepared-statement phía driver, và dùng local session/transaction state để bỏ các
# round-trip "SET autocommit" thừa. Ghi đè bằng env MYSQL_PARAMS nếu cần.
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:socialapp}?${MYSQL_PARAMS:useSSL=false&allowPublicKeyRetrieval=true&cachePrepStmts=true&useServerPrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useLocalSessionState=true&useLocalTransactionState=true&rewriteBatchedStatements=true&cacheServerConfiguration=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:tranhiep12345}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hikari: pool đủ cho tải nhỏ, timeout ngắn để lỗi sớm thay vì treo 30s.
spring.datasource.hikari.pool-name=forumPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:15}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.connection-timeout=${DB_POOL_TIMEOUT:10000}
spring.datasource.hikari.keepalive-time=60000

# Bật để soi số truy vấn + thời gian mỗi phiên (log "Session Metrics"). Mặc định tắt.
spring.jpa.properties.hibernate.generate_statistics=${JPA_STATS:false}
# Dialect: KHÔNG khai báo — Hibernate 6 tự nhận MySQLDialect (theo version) từ kết nối JDBC
# lúc khởi động (khuyến nghị HHH90000025). Trước đây file này khai cả MySQL5Dialect (dòng
# database-platform, bị bỏ qua) lẫn MySQL8Dialect (deprecated) -> đã gỡ cả hai.

spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.generate-ddl=true
# Migration schema do Flyway lo (xem db/migration/). "validate" = Hibernate chỉ KIỂM TRA
# entity khớp bảng, KHÔNG tự ALTER. Muốn quay lại hành vi cũ: đặt env DDL_AUTO=update
# (và FLYWAY_ENABLED=false) trong .env.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}

# --- Flyway ---
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
# DB prod đã tồn tại và CHƯA có bảng flyway_schema_history -> đánh dấu là đã ở V1,
# KHÔNG chạy lại V1 (chỉ chạy từ V2 trở đi). DB rỗng (deploy mới) -> chạy V1 bình thường.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=baseline (schema hiện có)
# Gộp truy vấn lazy (chống N+1): nạp theo lô thay vì từng bản ghi
spring.jpa.properties.hibernate.default_batch_fetch_size=64

server.port=${SERVER_PORT:8081}

# --- Cache (Redis) ---
# MẶC ĐỊNH TẮT: cache.type=none -> mọi @Cacheable thành no-op, chạy dev/CI không cần Redis.
# docker-compose đặt CACHE_TYPE=redis + REDIS_HOST=redis để bật.
spring.cache.type=${CACHE_TYPE:none}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Timeout NGẮN có chủ ý: cache chậm hơn DB thì cache vô nghĩa. Quá hạn -> coi như trượt
# cache (CacheConfig.errorHandler nuốt lỗi) và đi thẳng xuống DB.
spring.data.redis.timeout=${REDIS_TIMEOUT:300ms}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:500ms}
# Redis chỉ là cache -> mất Redis KHÔNG phải là backend hỏng. Để chỉ báo này bật thì
# /actuator/health thành DOWN và healthcheck của Docker báo backend unhealthy oan.
management.health.redis.enabled=false


# Actuator: chỉ lộ /actuator/health (không lộ env/metrics/beans...). show-details=never
# mặc định -> body chỉ {"status":"UP"}, trạng thái DB vẫn tính vào tổng.
management.endpoints.web.exposure.include=health

# BẮT BUỘC đặt qua env / .env (không còn giá trị mặc định — thiếu là backend không khởi
# động được). Khoá = base64 của >= 32 byte ngẫu nhiên: `openssl rand -base64 32`.
jwt.secretkey=${JWT_SECRET}
# TTL token khi user BỎ tick "ghi nhớ đăng nhập" (phiên tạm: đóng trình duyệt hoặc ngồi im > refresh TTL là hết).
jwt.short-access-expiration-ms=${JWT_SHORT_ACCESS_MS:900000}
jwt.short-refresh-expiration-ms=${JWT_SHORT_REFRESH_MS:1800000}

app.file.upload-dir=./uploads/images
app.file.no-reload=./uploads/images
# Ảnh upload: chặn kích thước + tự thu nhỏ/nén phía server trước khi lưu
app.file.max-size-bytes=${UPLOAD_MAX_BYTES:10485760}
app.file.max-dimension=${UPLOAD_MAX_DIMENSION:1600}
app.file.jpeg-quality=${UPLOAD_JPEG_QUALITY:0.82}

spring.servlet.multipart.max-file-size=${UPLOAD_MULTIPART_MAX:12MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MULTIPART_MAX:12MB}

# Tắt auto-restart của DevTools: netty-socketio (:8082) không nhả cổng khi hot-restart
# -> lần restart sau BindException. Vẫn giữ LiveReload, chỉ tắt phần restart.
spring.devtools.restart.enabled=${DEVTOOLS_RESTART:false}

# Kiểm duyệt: bài viết đạt số báo cáo OPEN >= ngưỡng này sẽ tự ẩn khỏi feed (0 = tắt).
app.moderation.post-autohide-threshold=${MOD_POST_AUTOHIDE:3}

# CORS: origin FE được phép (cách nhau dấu phẩy). "*" = mọi nơi. Deploy thật nên đặt cụ thể.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:*}

# Mã hoá nội dung tin nhắn chat khi lưu DB (AES-GCM). Base64 của 32 byte.
# Bỏ trống = KHÔNG mã hoá (plaintext như cũ). Tạo khoá: openssl rand -base64 32
app.message.crypto-key=${MESSAGE_CRYPTO_KEY:}

# Bắt buộc cấu hình qua env / .env (SENDGRID_API_KEY). Không có -> bỏ qua gửi mail (không crash).
send_grid.api_key=${SENDGRID_API_KEY:}
send_grid.from_email=${SENDGRID_FROM_EMAIL:no-reply@hipe.id.vn}
send_grid.from_name=${SENDGRID_FROM_NAME:HIPDN-EA Forum}

# Giới hạn tần suất /auth/** (chống brute-force mật khẩu + spam OTP). Bộ nhớ, khóa theo IP.
app.ratelimit.enabled=${RATELIMIT_ENABLED:true}
app.ratelimit.signin=${RATELIMIT_SIGNIN:20}
app.ratelimit.signin-window=${RATELIMIT_SIGNIN_WINDOW:300}
app.ratelimit.signup=${RATELIMIT_SIGNUP:6}
app.ratelimit.signup-window=${RATELIMIT_SIGNUP_WINDOW:3600}
app.ratelimit.otp-send=${RATELIMIT_OTP_SEND:5}
app.ratelimit.otp-send-window=${RATELIMIT_OTP_SEND_WINDOW:900}
app.ratelimit.otp-check=${RATELIMIT_OTP_CHECK:20}
app.ratelimit.otp-check-window=${RATELIMIT_OTP_CHECK_WINDOW:600}
# POST /report: chống 1 IP spam báo cáo để ép tự-ẩn bài (ngưỡng auto-hide = 3 tài khoản)
app.ratelimit.report=${RATELIMIT_REPORT:10}
app.ratelimit.report-window=${RATELIMIT_REPORT_WINDOW:3600}
app.ratelimit.default=${RATELIMIT_DEFAULT:40}
app.ratelimit.default-window=${RATELIMIT_DEFAULT_WINDOW:300}
# Tin header X-Forwarded-For/X-Real-IP để lấy IP client? Chỉ bật khi CÓ reverse proxy tin cậy
# (nginx/Cloudflare). Bật khi backend lộ trực tiếp = cho phép giả IP -> bypass rate limit.
app.ratelimit.trust-forwarded=${RATELIMIT_TRUST_FORWARDED:false}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.csrf.enabled=false
springdoc.swagger-ui.path=/api-docs.html
springdoc.cache.disabled=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

socket-server.port=${SOCKET_SERVER_PORT:8082}
socket-server.host=${SOCKET_SERVER_HOST:localhost}
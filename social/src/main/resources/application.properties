spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:socialapp}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:tranhiep12345}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL5Dialect

spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# Gộp truy vấn lazy (chống N+1): nạp theo lô thay vì từng bản ghi
spring.jpa.properties.hibernate.default_batch_fetch_size=64

server.port=${SERVER_PORT:8081}

jwt.secretkey=${JWT_SECRET:wyD7j04/rzm+8EABKgQTPO9cFojZI2Q2xRPycfhHtZc=}

app.file.upload-dir=./uploads/images
app.file.no-reload=./uploads/images
# Ảnh upload: chặn kích thước + tự thu nhỏ/nén phía server trước khi lưu
app.file.max-size-bytes=${UPLOAD_MAX_BYTES:10485760}
app.file.max-dimension=${UPLOAD_MAX_DIMENSION:1600}
app.file.jpeg-quality=${UPLOAD_JPEG_QUALITY:0.82}

spring.servlet.multipart.max-file-size=${UPLOAD_MULTIPART_MAX:12MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MULTIPART_MAX:12MB}

# Tắt auto-restart của DevTools: netty-socketio (:8082) không nhả cổng khi hot-restart
# -> lần restart sau BindException. Vẫn giữ LiveReload, chỉ tắt phần restart.
spring.devtools.restart.enabled=${DEVTOOLS_RESTART:false}

# Kiểm duyệt: bài viết đạt số báo cáo OPEN >= ngưỡng này sẽ tự ẩn khỏi feed (0 = tắt).
app.moderation.post-autohide-threshold=${MOD_POST_AUTOHIDE:3}

# Bắt buộc cấu hình qua env / .env (SENDGRID_API_KEY). Không có -> bỏ qua gửi mail (không crash).
send_grid.api_key=${SENDGRID_API_KEY:}
send_grid.from_email=${SENDGRID_FROM_EMAIL:no-reply@hipe.id.vn}
send_grid.from_name=${SENDGRID_FROM_NAME:HIPDN-EA Forum}

# Giới hạn tần suất /auth/** (chống brute-force mật khẩu + spam OTP). Bộ nhớ, khóa theo IP.
app.ratelimit.enabled=${RATELIMIT_ENABLED:true}
app.ratelimit.signin=${RATELIMIT_SIGNIN:20}
app.ratelimit.signin-window=${RATELIMIT_SIGNIN_WINDOW:300}
app.ratelimit.signup=${RATELIMIT_SIGNUP:6}
app.ratelimit.signup-window=${RATELIMIT_SIGNUP_WINDOW:3600}
app.ratelimit.otp-send=${RATELIMIT_OTP_SEND:5}
app.ratelimit.otp-send-window=${RATELIMIT_OTP_SEND_WINDOW:900}
app.ratelimit.otp-check=${RATELIMIT_OTP_CHECK:20}
app.ratelimit.otp-check-window=${RATELIMIT_OTP_CHECK_WINDOW:600}
app.ratelimit.default=${RATELIMIT_DEFAULT:40}
app.ratelimit.default-window=${RATELIMIT_DEFAULT_WINDOW:300}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.csrf.enabled=false
springdoc.swagger-ui.path=/api-docs.html
springdoc.cache.disabled=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

socket-server.port=${SOCKET_SERVER_PORT:8082}
socket-server.host=${SOCKET_SERVER_HOST:localhost}
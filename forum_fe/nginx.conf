server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: mọi route không phải file tĩnh đều trả index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html KHÔNG được cache: tên file asset có hash nên cache 7d an toàn, nhưng
    # index.html là thứ trỏ tới chúng. Không có header này, trình duyệt cache theo
    # heuristic -> deploy xong user vẫn tải chunk cũ. try_files ở trên internal-redirect
    # về /index.html nên location này vẫn khớp.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
